<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobaJoba — Email confirmed</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 680px;
    margin: 0 auto;
    padding: 40px 20px 80px;
    line-height: 1.6;
    color: #1a1a1a;
    background: #ffffff;
  }
  h1 {
    font-size: 26px;
    margin-bottom: 4px;
  }
  .updated {
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 32px;
  }
  h2 {
    font-size: 18px;
    margin-top: 32px;
    margin-bottom: 8px;
  }
  p {
    margin: 0 0 12px;
    color: #374151;
  }
  a {
    color: #2563eb;
  }
</style>
<style>
  .confirmed { text-align: center; padding-top: 48px; }
  .tick { font-size: 56px; line-height: 1; color: #16a34a; margin-bottom: 12px; }
</style>
</head>
<body>
<!--
  Where the "confirm your email" link lands (SignupController passes this
  page as emailRedirectTo). Supabase has already confirmed the address by
  the time anyone sees this — the page only has to say so. It must stay in
  the Supabase project's Redirect URLs allow-list, or Supabase falls back to
  the Site URL and people land on an error page again.

  If the link was expired or already used, Supabase adds an error to the
  address instead; the script below shows a gentler message for that.
-->
<div class="confirmed">
  <div class="tick" id="icon">✓</div>
  <h1 id="title">Your email is confirmed</h1>
  <p id="message">You can go back to the JobaJoba app. If you ever forget your password, we'll send a reset link to this email.</p>
</div>
<script>
  // Supabase reports a failed confirmation in the URL (?error=… or #error=…).
  var where = window.location.search + window.location.hash;
  if (/error/.test(where)) {
    document.getElementById('icon').textContent = '!';
    document.getElementById('icon').style.color = '#d97706';
    document.getElementById('title').textContent = 'This link has expired';
    document.getElementById('message').innerHTML =
      'It may have been used already, or it is too old. Your account still works — ' +
      'if you need help, email <a href="mailto:jobajobaapp@gmail.com">jobajobaapp@gmail.com</a>.';
  }
</script>
</body>
</html>
